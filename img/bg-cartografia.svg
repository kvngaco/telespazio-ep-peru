    <use href="#ch" x="1594" y="994" width="12" height="12"/>
    <use href="#ch" x="1794" y="194" width="12" height="12"/>
    <use href="#ch" x="1794" y="394" width="12" height="12"/>
    <use href="#ch" x="1794" y="594" width="12" height="12"/>
    <use href="#ch" x="1794" y="794" width="12" height="12"/>
    <use href="#ch" x="1794" y="994" width="12" height="12"/>
  </g>

  <!-- ===== COORDINATE LABELS ===== -->
  <g font-family="'Courier New',monospace" font-size="8" fill="#8b1d1d" opacity="0.14">
    <!-- Top edge -->
    <text x="200" y="14" text-anchor="middle">82°W</text>
    <text x="400" y="14" text-anchor="middle">80°W</text>
    <text x="600" y="14" text-anchor="middle">78°W</text>
    <text x="800" y="14" text-anchor="middle">76°W</text>
    <text x="1000" y="14" text-anchor="middle">74°W</text>
    <text x="1200" y="14" text-anchor="middle">72°W</text>
    <text x="1400" y="14" text-anchor="middle">70°W</text>
    <text x="1600" y="14" text-anchor="middle">68°W</text>
    <text x="1800" y="14" text-anchor="middle">66°W</text>
    <!-- Bottom edge -->
    <text x="200" y="1075" text-anchor="middle">82°W</text>
    <text x="400" y="1075" text-anchor="middle">80°W</text>
    <text x="600" y="1075" text-anchor="middle">78°W</text>
    <text x="800" y="1075" text-anchor="middle">76°W</text>
    <text x="1000" y="1075" text-anchor="middle">74°W</text>
    <text x="1200" y="1075" text-anchor="middle">72°W</text>
    <text x="1400" y="1075" text-anchor="middle">70°W</text>
    <text x="1600" y="1075" text-anchor="middle">68°W</text>
    <text x="1800" y="1075" text-anchor="middle">66°W</text>
    <!-- Left edge -->
    <text x="8" y="203">2°S</text>
    <text x="8" y="403">6°S</text>
    <text x="8" y="603">10°S</text>
    <text x="8" y="803">14°S</text>
    <text x="8" y="1003">18°S</text>
    <!-- Right edge -->
    <text x="1912" y="203" text-anchor="end">2°S</text>
    <text x="1912" y="403" text-anchor="end">6°S</text>
    <text x="1912" y="603" text-anchor="end">10°S</text>
    <text x="1912" y="803" text-anchor="end">14°S</text>
    <text x="1912" y="1003" text-anchor="end">18°S</text>
  </g>

  <!-- ===== COMPASS ROSE ===== -->
  <g transform="translate(1780,120)" opacity="0.25">
    <circle r="36" fill="none" stroke="#8b1d1d" stroke-width="0.8"/>
    <circle r="30" fill="none" stroke="#8b1d1d" stroke-width="0.4"/>
    <circle r="2" fill="#8b1d1d" opacity="0.5"/>
    <!-- Cardinal ticks -->
    <line x1="0" y1="-36" x2="0" y2="-28" stroke="#8b1d1d" stroke-width="1.2"/>
    <line x1="36" y1="0" x2="28" y2="0" stroke="#8b1d1d" stroke-width="0.7"/>
    <line x1="0" y1="36" x2="0" y2="28" stroke="#8b1d1d" stroke-width="0.7"/>
    <line x1="-36" y1="0" x2="-28" y2="0" stroke="#8b1d1d" stroke-width="0.7"/>
    <!-- Intercardinal ticks -->
    <line x1="22" y1="-22" x2="25.5" y2="-25.5" stroke="#8b1d1d" stroke-width="0.4"/>
    <line x1="22" y1="22" x2="25.5" y2="25.5" stroke="#8b1d1d" stroke-width="0.4"/>
    <line x1="-22" y1="22" x2="-25.5" y2="25.5" stroke="#8b1d1d" stroke-width="0.4"/>
    <line x1="-22" y1="-22" x2="-25.5" y2="-25.5" stroke="#8b1d1d" stroke-width="0.4"/>
    <!-- North arrow -->
    <polygon points="0,-28 -4.5,-18 0,-6 4.5,-18" fill="#8b1d1d" opacity="0.55"/>
    <polygon points="0,28 -3.5,20 0,10 3.5,20" fill="none" stroke="#8b1d1d" stroke-width="0.5" opacity="0.35"/>
    <!-- Labels -->
    <text x="0" y="-42" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#8b1d1d">N</text>
    <text x="44" y="4" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#8b1d1d">E</text>
    <text x="0" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#8b1d1d">S</text>
    <text x="-44" y="4" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#8b1d1d">O</text>
  </g>

  <!-- ===== TITLE BLOCK (cartographic legend) ===== -->
  <g transform="translate(1630,940)" opacity="0.18">
    <rect width="255" height="90" fill="#f3f4f6" stroke="#8b1d1d" stroke-width="0.8" rx="2"/>
    <line x1="0" y1="26" x2="255" y2="26" stroke="#8b1d1d" stroke-width="0.4"/>
    <line x1="0" y1="52" x2="255" y2="52" stroke="#8b1d1d" stroke-width="0.4"/>
    <text x="127" y="18" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#8b1d1d">CATASTRO URBANO — PERÚ</text>
    <text x="127" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#8b1d1d">Sistema Geodésico WGS84</text>
    <text x="127" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#8b1d1d">Proyección UTM Zona 18S</text>
    <text x="127" y="66" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#8b1d1d">Escala referencial</text>
    <text x="127" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#8b1d1d">1 : 100 000</text>
  </g>

  <!-- ===== SCALE BAR ===== -->
  <g transform="translate(1650,1045)" opacity="0.18">
    <rect x="0" y="0" width="50" height="5" fill="#8b1d1d"/>
    <rect x="50" y="0" width="50" height="5" fill="none" stroke="#8b1d1d" stroke-width="0.5"/>
    <rect x="100" y="0" width="50" height="5" fill="#8b1d1d"/>
    <rect x="150" y="0" width="50" height="5" fill="none" stroke="#8b1d1d" stroke-width="0.5"/>
    <text x="0" y="-3" font-family="Arial,sans-serif" font-size="6" fill="#8b1d1d" text-anchor="middle">0</text>
    <text x="50" y="-3" font-family="Arial,sans-serif" font-size="6" fill="#8b1d1d" text-anchor="middle">50</text>
    <text x="100" y="-3" font-family="Arial,sans-serif" font-size="6" fill="#8b1d1d" text-anchor="middle">100</text>
    <text x="150" y="-3" font-family="Arial,sans-serif" font-size="6" fill="#8b1d1d" text-anchor="middle">150</text>
    <text x="200" y="-3" font-family="Arial,sans-serif" font-size="6" fill="#8b1d1d" text-anchor="middle">200 km</text>
  </g>

  <!-- ===== CENTER CONTENT FADE ===== -->
  <rect width="1920" height="1080" fill="url(#cf)"/>

  <!-- ===== EDGE VIGNETTE ===== -->
  <rect width="1920" height="1080" fill="url(#ev)"/>
</svg>
