<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Fine coordinate grid -->
    <pattern id="gf" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40,0 L0,0 0,40" fill="none" stroke="#9ca3af" stroke-width="0.5"/>
    </pattern>
    <!-- Major coordinate grid -->
    <pattern id="gm" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200,0 L0,0 0,200" fill="none" stroke="#8b1d1d" stroke-width="0.8"/>
    </pattern>
    <!-- Peru fill gradient (W coast → E Amazon) -->
    <linearGradient id="pf" x1="0" y1="0" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#8b1d1d" stop-opacity="0.08"/>
      <stop offset="40%" stop-color="#8b1d1d" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#8b1d1d" stop-opacity="0.05"/>
    </linearGradient>
    <!-- Center content readability fade -->
    <radialGradient id="cf" cx="50%" cy="50%" r="42%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#f3f4f6" stop-opacity="0.92"/>
      <stop offset="60%" stop-color="#f3f4f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f3f4f6" stop-opacity="0"/>
    </radialGradient>
    <!-- Edge vignette -->
    <radialGradient id="ev" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#f3f4f6" stop-opacity="0"/>
      <stop offset="88%" stop-color="#f3f4f6" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f3f4f6" stop-opacity="0.5"/>
    </radialGradient>
    <!-- Crosshair marker -->
    <symbol id="ch" viewBox="-8 -8 16 16">
      <circle r="3" fill="none" stroke="#8b1d1d" stroke-width="0.5"/>
      <line x1="-7" y1="0" x2="-3.5" y2="0" stroke="#8b1d1d" stroke-width="0.4"/>
      <line x1="3.5" y1="0" x2="7" y2="0" stroke="#8b1d1d" stroke-width="0.4"/>
      <line x1="0" y1="-7" x2="0" y2="-3.5" stroke="#8b1d1d" stroke-width="0.4"/>
      <line x1="0" y1="3.5" x2="0" y2="7" stroke="#8b1d1d" stroke-width="0.4"/>
    </symbol>
  </defs>

  <!-- ===== BASE ===== -->
  <rect width="1920" height="1080" fill="#f3f4f6"/>

  <!-- ===== FINE GRID ===== -->
  <rect width="1920" height="1080" fill="url(#gf)" opacity="0.55"/>

  <!-- ===== MAJOR GRID ===== -->
  <rect width="1920" height="1080" fill="url(#gm)" opacity="0.22"/>

  <!-- ===== BACKGROUND CONTOUR LINES ===== -->
  <g fill="none" stroke="#8b1d1d" stroke-width="1" opacity="0.09">
    <path d="M-50,60 C300,35 600,95 960,65 S1400,105 1970,45"/>
    <path d="M-50,140 C280,115 580,175 960,145 S1420,185 1970,125"/>
    <path d="M-50,220 C320,190 620,255 960,225 S1440,265 1970,205"/>
    <path d="M-50,300 C340,265 640,335 960,305 S1460,345 1970,285"/>
    <path d="M-50,380 C360,340 660,415 960,385 S1480,425 1970,365"/>
    <path d="M-50,460 C380,420 680,495 960,465 S1500,505 1970,445"/>
    <path d="M-50,540 C400,500 700,575 960,545 S1520,585 1970,525"/>
    <path d="M-50,620 C420,580 720,655 960,625 S1540,665 1970,605"/>
    <path d="M-50,700 C440,660 740,735 960,705 S1560,745 1970,685"/>
    <path d="M-50,780 C460,740 760,815 960,785 S1580,825 1970,765"/>
    <path d="M-50,860 C480,820 780,895 960,865 S1600,905 1970,845"/>
    <path d="M-50,940 C500,900 800,975 960,945 S1620,985 1970,925"/>
    <path d="M-50,1020 C520,980 820,1055 960,1025 S1640,1065 1970,1005"/>
  </g>

  <!-- ===== PERU OUTLINE ===== -->
  <g>
    <!-- Country shape -->
    <path d="M784,358 C800,355 815,360 820,378 C828,384 838,385 848,386 C858,368 868,346 876,344 C898,308 922,275 946,263 C968,278 986,288 1002,296 C1040,332 1072,356 1100,378 C1100,436 1100,482 1100,526 C1112,546 1122,558 1128,568 C1134,588 1136,600 1136,610 C1134,638 1130,652 1128,666 C1124,710 1122,736 1120,758 C1114,768 1110,772 1106,772 C1096,768 1082,762 1061,753 C1050,744 1044,738 1044,736 C1018,716 1002,704 988,694 C968,680 956,672 946,666 C938,650 934,644 932,638 C918,618 910,606 904,596 C892,574 886,564 882,554 C872,532 866,520 862,512 C848,490 840,478 834,470 C824,454 818,448 814,442 C804,422 796,410 792,400 C786,380 784,368 784,358Z"
      fill="url(#pf)" stroke="#8b1d1d" stroke-width="1.8" stroke-opacity="0.30"/>

    <!-- Andes contour lines (N-S through western Peru) -->
    <g fill="none" stroke="#8b1d1d" stroke-width="0.8" opacity="0.18">
      <path d="M808,370 C812,420 820,480 835,540 C850,600 870,660 910,730"/>
      <path d="M820,360 C825,410 835,470 850,530 C865,590 885,650 925,720"/>
      <path d="M835,350 C842,400 852,460 868,520 C884,580 905,640 945,710"/>
      <path d="M850,345 C858,395 870,455 888,515 C906,575 928,630 965,700"/>
      <path d="M868,340 C878,390 892,450 910,510 C928,570 950,625 985,690"/>
      <path d="M888,338 C900,386 916,444 936,504 C956,564 978,616 1010,676"/>
      <path d="M908,336 C922,382 940,438 962,498 C984,558 1006,608 1035,666"/>
      <path d="M930,334 C946,378 966,432 988,492 C1010,552 1032,600 1058,656"/>
    </g>

    <!-- River suggestions (subtle gray dashes) -->
    <g fill="none" stroke="#6b7280" stroke-width="0.7" opacity="0.13" stroke-dasharray="4,3">
      <path d="M870,340 C890,350 920,365 960,385 C1000,405 1040,410 1080,425"/>
      <path d="M960,660 C970,620 990,580 1010,540 C1030,500 1060,460 1090,440"/>
      <path d="M1080,425 C1088,430 1092,435 1090,440"/>
    </g>

    <!-- City markers -->
    <g fill="#8b1d1d" opacity="0.25">
      <circle cx="904" cy="596" r="3.5"/>
      <text x="914" y="594" font-family="Arial,sans-serif" font-size="7.5" font-weight="600">Lima</text>
      <circle cx="1050" cy="670" r="2.5"/>
      <text x="1058" y="668" font-family="Arial,sans-serif" font-size="6.5">Cusco</text>
      <circle cx="832" cy="462" r="2"/>
      <text x="840" y="460" font-family="Arial,sans-serif" font-size="6">Chiclayo</text>
      <circle cx="826" cy="432" r="2"/>
      <text x="834" y="430" font-family="Arial,sans-serif" font-size="6">Piura</text>
      <circle cx="1060" cy="730" r="2"/>
      <text x="1068" y="728" font-family="Arial,sans-serif" font-size="6">Arequipa</text>
      <circle cx="1120" cy="650" r="2"/>
      <text x="1128" y="648" font-family="Arial,sans-serif" font-size="6">Pto. Maldonado</text>
    </g>

    <!-- Cadastral grid patches near Lima (VES, Chorrillos, SJM) -->
    <g fill="none" stroke="#8b1d1d" stroke-width="0.4" opacity="0.12">
      <rect x="889" y="584" width="8" height="6"/><rect x="897" y="584" width="8" height="6"/>
      <rect x="905" y="584" width="8" height="6"/><rect x="889" y="590" width="8" height="6"/>
      <rect x="897" y="590" width="8" height="6"/><rect x="905" y="590" width="8" height="6"/>
      <rect x="889" y="596" width="8" height="6"/><rect x="897" y="596" width="8" height="6"/>
      <rect x="905" y="596" width="8" height="6"/><rect x="889" y="602" width="8" height="6"/>
      <rect x="897" y="602" width="8" height="6"/><rect x="905" y="602" width="8" height="6"/>
      <rect x="913" y="584" width="8" height="6"/><rect x="913" y="590" width="8" height="6"/>
      <rect x="913" y="596" width="8" height="6"/><rect x="913" y="602" width="8" height="6"/>
    </g>

    <!-- Lake Titicaca hint -->
    <ellipse cx="1128" cy="690" rx="10" ry="6" fill="#6b7280" opacity="0.10" stroke="#6b7280" stroke-width="0.6" stroke-opacity="0.14"/>
  </g>

  <!-- ===== SURVEY CROSSHAIR MARKERS ===== -->
  <g opacity="0.28">
    <use href="#ch" x="194" y="194" width="12" height="12"/>
    <use href="#ch" x="194" y="394" width="12" height="12"/>
    <use href="#ch" x="194" y="594" width="12" height="12"/>
    <use href="#ch" x="194" y="794" width="12" height="12"/>
    <use href="#ch" x="194" y="994" width="12" height="12"/>
    <use href="#ch" x="394" y="194" width="12" height="12"/>
    <use href="#ch" x="394" y="394" width="12" height="12"/>
    <use href="#ch" x="394" y="594" width="12" height="12"/>
    <use href="#ch" x="394" y="794" width="12" height="12"/>
    <use href="#ch" x="394" y="994" width="12" height="12"/>
    <use href="#ch" x="1394" y="194" width="12" height="12"/>
    <use href="#ch" x="1394" y="394" width="12" height="12"/>
    <use href="#ch" x="1394" y="594" width="12" height="12"/>
    <use href="#ch" x="1394" y="794" width="12" height="12"/>
    <use href="#ch" x="1394" y="994" width="12" height="12"/>
    <use href="#ch" x="1594" y="194" width="12" height="12"/>
    <use href="#ch" x="1594" y="394" width="12" height="12"/>
    <use href="#ch" x="1594" y="594" width="12" height="12"/>
